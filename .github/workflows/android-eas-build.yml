name: Android APK (GitHub Actions)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "assets/brand/**"
      - ".github/workflows/android-eas-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out RxCheck
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure optional RxCheck AI endpoint
        if: ${{ vars.RXCHECK_AI_URL != '' }}
        run: echo "EXPO_PUBLIC_RXCHECK_AI_URL=${{ vars.RXCHECK_AI_URL }}" > .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload RxCheck APK
        uses: actions/upload-artifact@v4
        with:
          name: RxCheck-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
