name: Android APK (GitHub Actions)

# Keep all GitHub-maintained actions on Node 24-compatible major versions.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "modules/**"
      - "plugins/**"
      - "backend/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/android-eas-build.yml"
  workflow_dispatch:

concurrency:
  group: rxcheck-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out RxCheck
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify local Expo module autolinking
        run: |
          npx expo-modules-autolinking search
          npx expo-modules-autolinking resolve --platform android --json

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload RxCheck standalone APK
        uses: actions/upload-artifact@v5
        with:
          name: RxCheck-Standalone-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
